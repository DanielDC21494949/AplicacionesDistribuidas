<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login">

        <h2>Iniciar sesión</h2>

        <input
            type="text"
            id="usuario"
            placeholder="Usuario">

        <input
            type="password"
            id="password"
            placeholder="Contraseña">

        <button onclick="login()">
            Login
        </button>

        <!-- Aquí va el resultado -->
        <p id="respuesta"></p>

    </div>

    <script src="script.js"></script>

</body>
</html>
